# Site Daridja derrière Cloudflare. Remplacé par deploy.sh : __DOMAIN__

# www.__DOMAIN__ → __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/daridja;
    index index.html;

    # Seuls Cloudflare (et la VM elle-même, pour le test du déploiement) peuvent joindre ce site :
    # personne ne contourne Cloudflare Access en appelant l'IP de la VM.
    # Plages officielles : https://www.cloudflare.com/ips/
    allow 127.0.0.1;
    allow ::1;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;  # cadeau privé : pas dans Google

    # La page change à chaque mise à jour : jamais en cache longtemps
    location = /index.html { expires -1; }
    location = /photos/manifest.js { expires -1; }
    # Le service worker doit toujours être relu, sinon les mises à jour du jeu n'arrivent pas
    location = /sw.js { expires -1; }

    # Photos et icônes : en cache une semaine
    location ~* \.(webp|png|webmanifest)$ { expires 7d; }

    location / { try_files $uri $uri/ /index.html; }
}
