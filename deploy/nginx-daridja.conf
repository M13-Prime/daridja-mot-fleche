# Site Daridja derrière Cloudflare. Remplacé par deploy.sh : __DOMAIN__

# www.__DOMAIN__ → __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/daridja;
    index index.html;

    # Vraie IP du visiteur transmise par Cloudflare
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;  # cadeau privé : pas dans Google

    # La page change à chaque mise à jour : jamais en cache longtemps
    location = /index.html { expires -1; }
    location = /photos/manifest.js { expires -1; }

    # Photos et icônes : en cache une semaine
    location ~* \.(webp|png|webmanifest)$ { expires 7d; }

    location / { try_files $uri $uri/ /index.html; }
}
