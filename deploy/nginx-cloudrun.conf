server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /photos/manifest.js { add_header Cache-Control "no-cache"; }
    location ~* \.(webp|png|webmanifest)$ { add_header Cache-Control "public, max-age=604800"; }
    location / { try_files $uri $uri/ /index.html; }
}
