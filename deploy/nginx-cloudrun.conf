server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /index.html { expires -1; }
    location = /photos/manifest.js { expires -1; }
    location ~* \.(webp|png|webmanifest)$ { expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
