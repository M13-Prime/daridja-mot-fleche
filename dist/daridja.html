<title>Daridja Mots Fléchés</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone app, vues (accueil, carte, jeu, galerie) + feuilles du bas + visionneuse photo.
   Clair : blanc aéré, cases définitions pastel, or des étoiles, rose des cadeaux. Sombre : nuit bleutée douce. */
:root {
  --bg: #f6f8fc;
  --surface: #ffffff;
  --ink: #22303f;
  --muted: #6b7c90;
  --sea: #3d7fd9;
  --sea-ink: #ffffff;
  --sea-soft: #e5eefb;
  --sun: #f2b33d;
  --sun-ink: #4a3405;
  --mint: #2f9e70;
  --mint-soft: #dcf4e9;
  --coral: #dc5a49;
  --gift: #e98aa0;
  --gift-soft: #fde9ee;
  --cell: #ffffff;
  --clue: #dceafb;
  --clue-ink: #1f4e86;
  --block: #e6edf6;
  --grid: #d5e1ef;
  --hl: #fff3cf;
  --sel: #ffd970;
  --key: #ffffff;
  --key-edge: #cfdae7;
  --shadow: 0 4px 18px rgba(40, 72, 112, .09);
  --font-display: "Baloo Bhaijaan 2", "Baloo 2", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a24; --surface: #1c2733; --ink: #e9eff6; --muted: #94a6b9; --sea: #7ab0ec; --sea-ink: #0f1822;
    --sea-soft: #22364b; --sun: #f3c463; --sun-ink: #3a2a05; --mint: #5fc49a; --mint-soft: #1c3a2e; --coral: #f29484;
    --gift: #ee97ab; --gift-soft: #3a2630; --cell: #33465a; --clue: #234a75; --clue-ink: #dceafb; --block: #161f29;
    --grid: #0e151d; --hl: #4a3e20; --sel: #76601f; --key: #2b3a4b; --key-edge: #0e151d;
    --shadow: 0 4px 18px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a24; --surface: #1c2733; --ink: #e9eff6; --muted: #94a6b9; --sea: #7ab0ec; --sea-ink: #0f1822;
  --sea-soft: #22364b; --sun: #f3c463; --sun-ink: #3a2a05; --mint: #5fc49a; --mint-soft: #1c3a2e; --coral: #f29484;
  --gift: #ee97ab; --gift-soft: #3a2630; --cell: #33465a; --clue: #234a75; --clue-ink: #dceafb; --block: #161f29;
  --grid: #0e151d; --hl: #4a3e20; --sel: #76601f; --key: #2b3a4b; --key-edge: #0e151d;
  --shadow: 0 4px 18px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, .node:focus-visible, .card:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

.view {
  height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* ---------- Accueil ---------- */
#home { padding-block: 22px 20px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
#home { overflow-x: hidden; }
.brand h1 { font-family: var(--font-display); font-size: 42px; line-height: 1; margin: 0; color: var(--sea); letter-spacing: -.5px; }
.brand .ar { font-family: var(--font-display); font-size: 28px; color: var(--sun); flex: 1; min-width: 0; }
.tagline { color: var(--muted); margin: -8px 0 0; }
.theme { display: flex; background: var(--surface); border-radius: 99px; padding: 3px; box-shadow: var(--shadow); }
.theme button { padding: 6px 9px; min-width: 34px; border-radius: 99px; font-size: 12px; font-weight: 800; color: var(--muted); }
.theme button[aria-pressed="true"] { background: var(--sea-soft); color: var(--sea); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 0 -8px; }
.cards { display: grid; gap: 12px; }
.card {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; text-align: start;
  background: var(--surface); border-radius: 22px; padding: 16px 16px 14px; box-shadow: var(--shadow);
}
.card h2 { font-family: var(--font-display); font-size: 21px; margin: 0; }
.card .sample { color: var(--muted); grid-column: 1; }
.card .sample[dir="rtl"] { font-family: var(--font-display); font-size: 17px; text-align: start; }
.card .go { grid-row: 1 / span 2; grid-column: 2; width: 44px; height: 44px; border-radius: 50%; background: var(--sea-soft); color: var(--sea); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--sea-soft); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; min-width: 4px; }
.card .lvl { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.card.gift { background: var(--gift-soft); }
.card.gift .go { background: var(--surface); color: var(--gift); }
.card.gift .bar { background: var(--surface); }
.card.gift .bar i { background: var(--gift); }

/* ---------- Barres du haut ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 10px 8px; }
.topbar h2 { font-family: var(--font-display); font-size: 20px; margin: 0; flex: 1; min-width: 0; line-height: 1.15; }
.topbar small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 42px; height: 42px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 24px; font-weight: 700; flex: none; }
.pill { background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 14px; display: flex; gap: 5px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill .star { color: var(--sun); }
.pill.giftpill { color: var(--gift); }

/* ---------- Carte ---------- */
#mapScroll { flex: 1; margin-inline: -16px; padding-inline: 16px; }
.chapter { position: relative; padding-block: 22px 8px; }
.chapter-head { text-align: center; margin-bottom: 6px; }
.chapter-head b { font-family: var(--font-display); font-size: 20px; display: block; color: var(--sea); }
.chapter-head span { font-size: 12px; color: var(--muted); }
.path { position: relative; }
.path svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.node {
  position: absolute; width: 60px; height: 60px; margin-left: -30px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; font-weight: 700;
  background: var(--surface); color: var(--muted); box-shadow: var(--shadow), inset 0 -4px 0 var(--sea-soft);
}
.node.done { background: var(--sea); color: var(--sea-ink); box-shadow: var(--shadow), inset 0 -4px 0 rgba(0,0,0,.12); }
.node.current { background: var(--sun); color: var(--sun-ink); width: 72px; height: 72px; margin-left: -36px; font-size: 26px; }
.node.current::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--sun); opacity: .5; animation: pulse 1.8s ease-out infinite; }
.node .stars { position: absolute; bottom: -15px; font-size: 13px; letter-spacing: -1px; color: var(--sun); text-shadow: 0 1px 0 var(--bg); }
@keyframes pulse { from { transform: scale(.9); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }

/* ---------- Jeu ---------- */
.cluebar {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 8px 12px;
  box-shadow: var(--shadow); min-height: 50px;
}
.cluebar .arrow { width: 28px; height: 28px; border-radius: 9px; background: var(--clue); color: var(--clue-ink); display: grid; place-items: center; flex: none; font-size: 14px; }
.cluebar p { margin: 0; flex: 1; min-width: 0; font-weight: 800; font-size: 16px; }
.cluebar.alert p { color: var(--coral); font-size: 14px; }
.cluebar .len { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.boardwrap { flex: 1; min-height: 0; display: grid; place-items: center; padding-block: 8px; }
#board {
  --n: 5; --cs: 40px; display: grid; grid-template-columns: repeat(var(--n), var(--cs)); grid-auto-rows: var(--cs);
  gap: 2px; padding: 2px; background: var(--grid); border-radius: 14px; overflow: hidden;
}
.cell { position: relative; border-radius: 6px; display: grid; place-items: center; overflow: hidden; }
.cell.B { background: var(--block); }
.cell.L { background: var(--cell); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--cs) * .52); line-height: 1; }
.cell.L.hl { background: var(--hl); }
.cell.L.sel { background: var(--sel); }
.cell.L.bad { color: var(--coral); animation: shake .35s; }
.cell.L.good { background: var(--mint-soft); color: var(--mint); }
.cell.L.hint { color: var(--sea); }
.cell.C { background: var(--clue); color: var(--clue-ink); display: flex; flex-direction: column; padding: 1px; }
.clue {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: max(7px, calc(var(--cs) * .17)); line-height: 1.05; font-weight: 800; padding: 0 calc(var(--cs) * .1);
  position: relative; overflow: hidden; word-break: break-word;
}
.clue + .clue { border-top: 1px solid var(--surface); }
.clue::after { position: absolute; font-size: max(7px, calc(var(--cs) * .16)); opacity: .8; }
.clue.right::after { content: "▸"; right: 1px; }
.rtl .clue.right::after { content: "◂"; right: auto; left: 1px; }
.clue.down::after { content: "▾"; bottom: -1px; right: 1px; }
.rtl .clue.down::after { right: auto; left: 1px; }
.clue.active { background: var(--sea-soft); }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

.actions { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; padding-block: 2px 8px; }
.btn { border-radius: 14px; padding: 11px 8px; min-height: 44px; font-weight: 800; font-size: 15px; background: var(--surface); box-shadow: var(--shadow); }
.btn.primary { background: var(--sea); color: var(--sea-ink); }
.btn.warn { color: var(--coral); }
.btn.giftbtn { background: var(--gift); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn .count { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }

/* Champ invisible qui reçoit le clavier de l'iPhone. 16 px minimum, sinon Safari zoome sur la page. */
#kbInput {
  position: fixed; top: 30%; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
  font-size: 16px; caret-color: transparent; background: transparent; color: transparent; pointer-events: none;
}
#game { padding-bottom: env(safe-area-inset-bottom, 0px); }
body.kb-open #game { padding-bottom: 0; }
body.kb-open .boardwrap { padding-block: 4px; }

/* ---------- Carnet ---------- */
#carnetList { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: start; padding-bottom: 16px; }
.carnet-h { font-family: var(--font-display); font-size: 18px; margin: 10px 0 0; color: var(--sea); }
#carnetList .empty { color: var(--muted); text-align: center; margin-top: 40px; }
.reward.rue { background: var(--mint-soft); }
.reward.rai { background: var(--gift-soft); }
.reward .kicker b { color: var(--sea); }

/* ---------- Galerie ---------- */
#gallery { padding-bottom: 12px; }
#galleryGrid { flex: 1; min-height: 0; padding-bottom: 12px; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumb { aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; position: relative; background: var(--gift-soft); display: grid; place-items: center; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.locked { background: var(--surface); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--block); }
.thumb .num { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.thumb.locked .num { font-size: 15px; opacity: .7; }
.thumb .ph { color: var(--gift); font-family: var(--font-display); font-size: 22px; font-weight: 700; }

/* ---------- Feuilles ---------- */
.scrim { position: fixed; inset: 0; background: rgba(18, 30, 46, .42); display: grid; align-items: end; z-index: 20; }
.sheet {
  background: var(--surface); border-radius: 28px 28px 0 0; width: 100%; max-width: 520px; margin: 0 auto;
  padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; max-height: 94%; overflow-y: auto; animation: up .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { font-family: var(--font-display); font-size: 30px; margin: 0; text-align: center; color: var(--sea); line-height: 1.1; }
.sheet .sub { text-align: center; color: var(--muted); margin: -8px 0 0; }
.bigstars { text-align: center; font-size: 42px; letter-spacing: 4px; color: var(--block); line-height: 1; }
.bigstars .on { color: var(--sun); display: inline-block; animation: pop .5s both; }
.bigstars .on:nth-child(2) { animation-delay: .15s; } .bigstars .on:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25); } }
.xp { text-align: center; font-weight: 800; color: var(--mint); margin: 0; }
.giftcard { background: var(--gift-soft); border-radius: 22px; padding: 12px; display: grid; gap: 8px; text-align: center; animation: pop .6s .4s both; }
.giftcard .kicker, .reward .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.giftcard .kicker { color: var(--gift); }
.giftcard button { padding: 0; border-radius: 16px; overflow: hidden; }
.giftcard img { width: 100%; max-height: 42vh; object-fit: cover; display: block; border-radius: 16px; }
.giftcard .placeholder { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; background: var(--surface); border-radius: 16px; color: var(--gift); font-family: var(--font-display); font-size: 40px; font-weight: 700; }
.giftcard .caption { font-style: italic; color: var(--muted); }
.next-gift { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 5px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--block); box-shadow: inset 0 0 0 1.5px var(--gift); }
.dots i.on { background: var(--gift); }
.reward { background: var(--sea-soft); border-radius: 20px; padding: 14px; display: grid; gap: 4px; text-align: center; }
.reward .dz { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.reward .dz[dir="rtl"] { font-size: 21px; color: var(--sea); }
.reward .fr { color: var(--muted); font-style: italic; }
.recap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { background: var(--bg); border-radius: 99px; padding: 5px 10px; font-size: 13px; }
.chip b { font-family: var(--font-display); }
.sheet .buttons { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

/* ---------- Visionneuse ---------- */
.lightbox { position: fixed; inset: 0; z-index: 40; background: #0b0f14; color: #f2f5f9; display: flex; flex-direction: column; }
.lightbox .lbtop {
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.lightbox .lbtop button { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.12); color: #f2f5f9; font-size: 22px; }
.lightbox .lbimg { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0 8px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.lightbox .placeholder { width: min(80vw, 360px); aspect-ratio: 4 / 3; border-radius: 16px; background: #1d2733; display: grid; place-items: center; font-family: var(--font-display); font-size: 48px; color: #ee97ab; }
.lightbox .lbbottom {
  display: flex; align-items: center; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lightbox .lbbottom button { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.12); color: #f2f5f9; font-size: 24px; flex: none; }
.lightbox .lbbottom button:disabled { opacity: .3; }
.lightbox .lbcap { flex: 1; text-align: center; font-size: 14px; color: #c5ced8; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-height: 700px) {
  .cluebar { min-height: 44px; padding-block: 5px; }
  #home { gap: 14px; }
}
</style>

<section id="home" class="view scrollable">
  <div class="brand">
    <h1>Daridja</h1><span class="ar" lang="ar">دارجة</span>
    <div class="theme" role="group" aria-label="Thème">
      <button data-theme-set="auto" aria-label="Thème automatique">Auto</button><button data-theme-set="light" aria-label="Thème clair">☀︎</button><button data-theme-set="dark" aria-label="Thème sombre">☾</button>

    <button class="card" data-mode="latin">

    </button>
    <button class="card" data-mode="arabic">
      <h2>Lettres arabes</h2>
      <span class="sample" dir="rtl" lang="ar">خبز · يما · بزاف</span>
      <span class="go" aria-hidden="true">›</span>
      <div class="bar"><i id="barArabic"></i></div>
      <span class="lvl" id="lvlArabic"></span>
    </button>
  </div>
  <p class="section-label">Tes cadeaux</p>
  <div class="cards">
    <button class="card" id="openCarnet">
      <h2>Carnet de dictons</h2>
      <span class="sample">Proverbes, rue, raï et chaâbi</span>
      <span class="go" aria-hidden="true">›</span>

    <button class="card gift" id="openGallery">

  </div>
</section>

<section id="map" class="view" hidden>
  <div class="topbar">
    <button class="iconbtn" id="mapBack" aria-label="Retour à l'accueil">‹</button>
    <h2 id="mapTitle">Lettres latines</h2>
    <span class="pill giftpill" id="mapGift"></span>
    <span class="pill"><span class="star">★</span><span id="mapStars">0</span></span>
  </div>
  <div id="mapScroll" class="scrollable"></div>
</section>

<section id="game" class="view" hidden>
  <div class="topbar">
    <button class="iconbtn" id="gameBack" aria-label="Retour à la carte">‹</button>
    <h2 id="gameTitle">Niveau 1</h2>
    <span class="pill" id="xpPill">0 XP</span>
  </div>
  <div class="cluebar" id="cluebar">

  const SAYINGS = Array.isArray(window.SAYINGS) ? window.SAYINGS : [];

    const byKind = {};
    SAYINGS.forEach((x, i) => (byKind[x.k] = byKind[x.k] || []).push(i));
    const order = [];
    const kinds = Object.keys(byKind);
    for (let r = 0; order.length < SAYINGS.length; r++) kinds.forEach((k) => { if (byKind[k][r] !== undefined) order.push(byKind[k][r]); });
    const due = {}, pending = [], last = {}, seq = [];
    let next = 0;
    for (let step = 0; step < 2000 && SAYINGS.length; step++) {
      (due[step] || []).forEach((i) => pending.push(i));
      let id;
      if (pending.length) id = pending.shift();
      else if (next < order.length) {
        id = order[next++];
        REVIEW_GAPS.forEach((g) => (due[step + g] = due[step + g] || []).push(id));
      } else id = order.reduce((a, b) => ((last[a] ?? -1) <= (last[b] ?? -1) ? a : b)); // révision du plus ancien
      last[id] = step;
      seq.push(id);

      const total = RAW[m].length;
      const done = Object.keys(starsOf(m)).length;
      $("bar" + k).style.width = `${(done / total) * 100}%`;
      $("lvl" + k).textContent = done
        ? `Niveau ${frontier(m)} sur ${total} · ${chapterOf(frontier(m))[0]}`
        : `${total} niveaux, du plus simple au plus corsé`;
    });
    const learned = Object.keys(store.seenSay).length;
    $("barSay").style.width = `${SAYINGS.length ? (learned / SAYINGS.length) * 100 : 0}%`;
    $("lvlSay").textContent = learned
      ? `${learned} dicton${learned > 1 ? "s" : ""} rencontré${learned > 1 ? "s" : ""} sur ${SAYINGS.length}`
      : `${SAYINGS.length} dictons à découvrir en jouant`;
    const g = unlockedGifts();
    $("barGift").style.width = `${(g / GIFT_TOTAL) * 100}%`;
    $("lvlGift").textContent = `${g} photo${g > 1 ? "s" : ""} sur ${GIFT_TOTAL} · la prochaine dans ${levelsBeforeGift()} niveau${levelsBeforeGift() > 1 ? "x" : ""}`;
    show("home");
  }

  // ---------- Carte ----------
  let mode = "latin";

  function renderMap() {
    const levels = RAW[mode];
    $("mapTitle").innerHTML = `${mode === "arabic" ? "Lettres arabes" : "Lettres latines"}<small>Touche n'importe quel niveau pour y aller</small>`;
    $("mapStars").textContent = totalStars(mode);
    const left = levelsBeforeGift();
    $("mapGift").textContent = `♥ ${left}`;
    $("mapGift").setAttribute("aria-label", `Prochaine photo dans ${left} niveaux`);
    const scroll = $("mapScroll");
    scroll.innerHTML = "";
    const front = frontier(mode);
    const STEP = 96;
    const nChapters = Math.ceil(levels.length / PER_CHAPTER);
    for (let ch = nChapters - 1; ch >= 0; ch--) {
      const first = ch * PER_CHAPTER + 1;
      const count = Math.min(PER_CHAPTER, levels.length - first + 1);
      const [name, sub] = CHAPTERS[Math.min(ch, CHAPTERS.length - 1)];
      const sec = document.createElement("div");
      sec.className = "chapter";
      sec.innerHTML = `<div class="chapter-head"><b>${name}</b><span>Étape ${ch + 1} · ${sub} · niveaux ${first} à ${first + count - 1}</span></div>`;
      const path = document.createElement("div");
      path.className = "path";
      path.style.height = `${count * STEP}px`;
      const pts = [];
      for (let k = 0; k < count; k++) {
        const n = first + k;
        const x = 50 + 28 * Math.sin((n - 1) * 0.95);
        const y = (count - 1 - k) * STEP + STEP / 2;
        pts.push([x, y]);
        const stars = starsOf(mode)[n] || 0;
        const b = document.createElement("button");
        b.className = "node" + (stars ? " done" : "") + (n === front ? " current" : "");
        b.style.left = `${x}%`;
        b.style.top = `${y - (n === front ? 36 : 30)}px`;
        b.setAttribute("aria-label", `Niveau ${n}${stars ? `, ${stars} étoiles` : ""}`);
        b.innerHTML = `${n}${stars ? `<span class="stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span>` : ""}`;
        b.onclick = () => (n > front ? askSkip(n) : startLevel(n));
        if (n === front) b.id = "frontNode";
        path.appendChild(b);
      }
      const d = pts.map((p, i) => `${i ? "L" : "M"} ${p[0]} ${p[1]}`).join(" ");
      path.insertAdjacentHTML("afterbegin",
        `<svg viewBox="0 0 100 ${count * STEP}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--sea-soft)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="${d}" fill="none" stroke="var(--surface)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`);
      sec.appendChild(path);
      scroll.appendChild(sec);
    }
    show("map");
    const node = $("frontNode");
    if (node) node.scrollIntoView({ block: "center" });
  }

  function askSkip(n) {
    openSheet(`
      <h3>Niveau ${n} ?</h3>
      <p class="sub">Tu peux sauter directement à ce niveau. Ceux d'avant restent ouverts, tu pourras y revenir quand tu veux.</p>
      <div class="buttons"><button class="btn" id="skipNo">Annuler</button><button class="btn primary" id="skipYes">Jouer le niveau ${n}</button></div>`);
    $("skipNo").onclick = closeSheet;
    $("skipYes").onclick = () => { closeSheet(); startLevel(n); };
  }

  // ---------- Niveau : la grille se reconstruit à partir des mots ----------
  function expand(lv) {
    const s = lv.s;
    const cells = Array.from({ length: s }, () => Array.from({ length: s }, () => ({ t: "B" })));
    const words = lv.w.map(([word, clue, latin, ar, r, c, d]) => ({ word, chars: [...word], clue, latin, ar, r, c, dir: d ? "down" : "right" }));
    words.forEach((w) => {
      const [cr, cc] = w.dir === "right" ? [w.r, w.c - 1] : [w.r - 1, w.c];
      if (cells[cr][cc].t !== "C") cells[cr][cc] = { t: "C", clues: {} };
      cells[cr][cc].clues[w.dir] = w.clue;
      w.chars.forEach((ch, i) => {
        const [r, c] = w.dir === "right" ? [w.r, w.c + i] : [w.r + i, w.c];
        cells[r][c] = { t: "L", a: ch };
      });
    });
    return { n: lv.n, size: s, cells, words };
  }

  // ---------- Jeu ----------
  let L = null;
  let rtl = false;
  let entries = {};
  let revealed = new Set();
  let sel = null;
  let hintsLeft = 3, hintsUsed = 0, wrongChecks = 0;
  const key = (r, c) => `${r},${c}`;
  const cellEl = {};

  function wordAt(r, c, d) {
    return L.words.find((w) => w.dir === d &&
      (d === "right" ? w.r === r && c >= w.c && c < w.c + w.chars.length
                     : w.c === c && r >= w.r && r < w.r + w.chars.length));
  }
  const cellsOf = (w) => w.chars.map((_, i) => (w.dir === "right" ? [w.r, w.c + i] : [w.r + i, w.c]));
  const answer = (r, c) => L.cells[r][c].a;

  function startLevel(n) {
    L = expand(RAW[mode][n - 1]);
    rtl = mode === "arabic";
    entries = {}; revealed = new Set(); hintsLeft = 3; hintsUsed = 0; wrongChecks = 0;
    $("gameTitle").innerHTML = `Niveau ${n}<small>${chapterOf(n)[0]} · ${L.words.length} mots</small>`;
    $("xpPill").textContent = `${store.xp} XP`;
    $("btnHint").disabled = true;
    $("hintCount").textContent = hintsLeft;
    $("kbInput").blur();
    renderBoard();
    show("game");
    fitBoard();
    select(L.words[0].r, L.words[0].c, L.words[0].dir);
  }

  function renderBoard() {
    const board = $("board");
    board.innerHTML = "";
    board.classList.toggle("rtl", rtl);
    board.setAttribute("dir", "ltr");
    board.style.setProperty("--n", L.size);
    for (const k in cellEl) delete cellEl[k];
    L.cells.forEach((row, r) => row.forEach((cell, c) => {
      const el = document.createElement("div");
      el.className = `cell ${cell.t}`;
      el.style.gridRow = r + 1;
      el.style.gridColumn = (rtl ? L.size - 1 - c : c) + 1;
      if (cell.t === "C") {
        ["right", "down"].forEach((d) => {
          if (!cell.clues[d]) return;
          const s = document.createElement("div");
          s.className = `clue ${d}`;
          s.textContent = cell.clues[d];
          s.dataset.r = r; s.dataset.c = c; s.dataset.d = d;
          s.onclick = () => { d === "right" ? select(r, c + 1, d) : select(r + 1, c, d); openKeyboard(); };
          el.appendChild(s);
        });
      } else if (cell.t === "L") {
        el.setAttribute("role", "gridcell");
        el.onclick = () => {
          // Premier toucher : ouvre le clavier. Toucher à nouveau la case choisie : change de sens.
          if (sel && sel.r === r && sel.c === c && keyboardOpen()) {
            const other = sel.dir === "right" ? "down" : "right";
            if (wordAt(r, c, other)) select(r, c, other);
          } else select(r, c, sel ? sel.dir : "right");
          openKeyboard();
        };
        cellEl[key(r, c)] = el;
      }
      board.appendChild(el);
    }));
  }

  function paintCell(r, c) {
    const el = cellEl[key(r, c)];
    el.textContent = entries[key(r, c)] || "";
    el.classList.toggle("hint", revealed.has(key(r, c)));
  }

  function select(r, c, dir) {
    const w = wordAt(r, c, dir) || wordAt(r, c, dir === "right" ? "down" : "right");
    if (!w) return;
    sel = { r, c, dir: w.dir };
    document.querySelectorAll(".cell.hl, .cell.sel").forEach((el) => el.classList.remove("hl", "sel"));
    document.querySelectorAll(".clue.active").forEach((el) => el.classList.remove("active"));
    cellsOf(w).forEach(([rr, cc]) => cellEl[key(rr, cc)].classList.add("hl"));
    cellEl[key(r, c)].classList.add("sel");
    const [cr, cc] = w.dir === "right" ? [w.r, w.c - 1] : [w.r - 1, w.c];
    const clueEl = document.querySelector(`.clue[data-r="${cr}"][data-c="${cc}"][data-d="${w.dir}"]`);
    if (clueEl) clueEl.classList.add("active");
    $("cluebar").classList.remove("alert");
    $("clueArrow").textContent = w.dir === "down" ? "▾" : rtl ? "◂" : "▸";
    $("clueText").textContent = w.clue;
    $("clueLen").textContent = `${w.chars.length} lettres`;
  }

  const currentWord = () => sel && wordAt(sel.r, sel.c, sel.dir);

  function step(delta) {
    const w = currentWord();
    const cells = cellsOf(w);
    const i = cells.findIndex(([r, c]) => r === sel.r && c === sel.c);
    const j = i + delta;
    if (j >= 0 && j < cells.length) select(cells[j][0], cells[j][1], w.dir);
  }

  function setEntry(r, c, v) {
    const k = key(r, c);
    if (revealed.has(k)) return;
    if (v) entries[k] = v; else delete entries[k];
    cellEl[k].classList.remove("bad", "good");
    paintCell(r, c);
  }

  function type(ch) {
    if (!sel || !$("scrim").hidden) return;
    if (ch === "⌫") return erase();
    setEntry(sel.r, sel.c, ch);
    step(1);
  }

  function erase() {
    const k = key(sel.r, sel.c);
    if (entries[k] && !revealed.has(k)) return setEntry(sel.r, sel.c, "");
    step(-1);
    setEntry(sel.r, sel.c, "");
  }

  // ---------- Clavier de l'iPhone ----------
  // Un champ invisible reçoit la frappe. Il contient toujours une espace « témoin » :
  // si elle disparaît, c'est que la touche effacer a été pressée (l'iPhone n'envoie rien d'autre).
  const kbInput = $("kbInput");
  const SENTINEL = " ";
  let composing = false;
  let warned = false;
  const keyboardOpen = () => document.activeElement === kbInput;
  function resetInput() { kbInput.value = SENTINEL; try { kbInput.setSelectionRange(1, 1); } catch (e) {} }
  function openKeyboard() {
    kbInput.lang = rtl ? "ar" : "fr";
    kbInput.dir = rtl ? "rtl" : "ltr";
    resetInput();
    kbInput.focus({ preventScroll: true });
  }

  // Ramène ce que tape l'iPhone aux lettres de la grille : minuscules, sans accents, sans voyelles arabes.
  function normalize(ch) {
    if (rtl) {
      ch = ch.replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[أإآٱ]/g, "ا");
      return /^[\u0621-\u064A]$/.test(ch) ? ch : null;
    }
    ch = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    return /^[a-z0-9]$/.test(ch) ? ch : null;
  }

  function feed(text) {
    for (const raw of text) {
      const ch = normalize(raw);
      if (ch) { type(ch); continue; }
      if (raw.trim() && !warned) {
        warned = true;
        flash(rtl ? "Passe au clavier arabe avec la touche 🌐 (Réglages → Général → Clavier → Claviers pour l'ajouter)."
                  : "Passe au clavier français ou anglais avec la touche 🌐.");
      }
    }
  }

  kbInput.addEventListener("compositionstart", () => { composing = true; });
  kbInput.addEventListener("compositionend", () => { composing = false; handleInput(); });
  kbInput.addEventListener("input", () => { if (!composing) handleInput(); });
  function handleInput() {
    const v = kbInput.value;
    if (v.length === 0) erase();                         // l'espace témoin a été effacée
    else feed(v.startsWith(SENTINEL) ? v.slice(1) : v);  // lettres tapées (ou mot proposé par le clavier)
    resetInput();
  }
  kbInput.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && kbInput.value === SENTINEL) { e.preventDefault(); erase(); return; }
    const arrows = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1, ArrowDown: 1, ArrowUp: -1 };
    if (e.key in arrows && sel) {
      const d = e.key === "ArrowUp" || e.key === "ArrowDown" ? "down" : "right";
      const dr = d === "down" ? arrows[e.key] : 0, dc = d === "right" ? arrows[e.key] : 0;
      if (cellEl[key(sel.r + dr, sel.c + dc)]) select(sel.r + dr, sel.c + dc, d);
      e.preventDefault();
    }
    if (e.key === "Enter") { e.preventDefault(); kbInput.blur(); }
  });

  // Quand le clavier apparaît, le jeu se réduit à la partie visible de l'écran : la grille reste au-dessus.
  function fitViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    const open = vv.height < window.innerHeight - 100;
    document.body.classList.toggle("kb-open", open);
    if (open) {
      $("game").style.height = `${vv.height - Math.max(0, parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0)}px`;
      window.scrollTo(0, 0);
    } else {
      $("game").style.height = "";
    }
    fitBoard();
  }
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", fitViewport);
    visualViewport.addEventListener("scroll", () => { if (document.body.classList.contains("kb-open")) window.scrollTo(0, 0); });
  }

  function flash(msg) {
    $("cluebar").classList.add("alert");
    $("clueText").textContent = msg;
    $("clueLen").textContent = "";
  }

  function check() {
    let empty = 0, wrong = 0;
    L.cells.forEach((row, r) => row.forEach((cell, c) => {
      if (cell.t !== "L") return;
      const el = cellEl[key(r, c)];
      el.classList.remove("bad", "good");
      const v = entries[key(r, c)];
      if (!v) { empty++; return; }
      if (v !== cell.a) { wrong++; void el.offsetWidth; el.classList.add("bad"); }
    }));
    if (!empty && !wrong) return win();
    wrongChecks++;
    $("btnHint").disabled = hintsLeft === 0;
    const parts = [];
    if (wrong) parts.push(`${wrong} lettre${wrong > 1 ? "s" : ""} fausse${wrong > 1 ? "s" : ""}`);
    if (empty) parts.push(`${empty} case${empty > 1 ? "s" : ""} vide${empty > 1 ? "s" : ""}`);
    flash(`Pas encore : ${parts.join(", ")}.${hintsLeft ? " Un indice ?" : ""}`);
  }

  function hint() {
    if (!hintsLeft) return;
    const needs = ([r, c]) => entries[key(r, c)] !== answer(r, c);
    let target = currentWord() && cellsOf(currentWord()).find(needs);
    if (!target) {
      for (const w of L.words) { target = cellsOf(w).find(needs); if (target) { select(target[0], target[1], w.dir); break; } }
    }
    if (!target) return;
    const [r, c] = target;
    entries[key(r, c)] = answer(r, c);
    revealed.add(key(r, c));
    cellEl[key(r, c)].classList.remove("bad");
    paintCell(r, c);
    hintsLeft--; hintsUsed++;
    $("hintCount").textContent = hintsLeft;
    $("btnHint").disabled = hintsLeft === 0;
  }

  let clearTimer = null;
  function clearGrid() {
    const b = $("btnClear");
    if (!b.dataset.armed) {
      b.dataset.armed = "1"; b.textContent = "Sûr ?";
      clearTimer = setTimeout(() => { delete b.dataset.armed; b.textContent = "Effacer"; }, 2500);
      return;
    }
    clearTimeout(clearTimer); delete b.dataset.armed; b.textContent = "Effacer";
    L.cells.forEach((row, r) => row.forEach((cell, c) => { if (cell.t === "L") setEntry(r, c, ""); }));
  }

  // ---------- Victoire, récompense et cadeau ----------
  function photoHtml(i, cls = "") {
    const p = PHOTOS[i];
    return p ? `<img class="${cls}" src="${p.src}" alt="${p.caption ? p.caption.replace(/"/g, "&quot;") : `Photo ${i + 1}`}">`
             : `<div class="placeholder">${i + 1}</div>`;
  }

  function win() {
    const n = L.n;
    const stars = hintsUsed === 0 && wrongChecks === 0 ? 3 : hintsUsed <= 1 && wrongChecks <= 2 ? 2 : 1;
    const prev = starsOf(mode)[n] || 0;
    const giftsBefore = unlockedGifts();
    let gained = 0;
    if (stars > prev) {
      gained = (stars - prev) * 10 + (prev ? 0 : L.words.length * 2);
      starsOf(mode)[n] = stars;
      store.xp += gained;
    }
    if (store.streak.last !== today()) {
      store.streak.count = store.streak.last === yesterday() ? store.streak.count + 1 : 1;
      store.streak.last = today();
    }
    save();
    const newGift = unlockedGifts() > giftsBefore ? unlockedGifts() - 1 : -1;
    L.cells.forEach((row, r) => row.forEach((cell, c) => { if (cell.t === "L") cellEl[key(r, c)].classList.add("good"); }));

    let sayingHtml = "";
    if (SCHEDULE.length) {
      const id = SCHEDULE[store.sayStep % SCHEDULE.length];
      const x = SAYINGS[id];
      const seen = store.seenSay[id] || 0;
      store.seenSay[id] = seen + 1;
      store.sayStep++;
      save();
      const tag = seen ? `À revoir · ${seen + 1}ᵉ fois` : "Nouveau";
      sayingHtml = `<div class="reward ${x.k}">
          <span class="kicker">${KIND_LABEL[x.k]} · <b>${tag}</b></span>
          <span class="dz">${x.dz}</span>
          <span class="dz" dir="rtl" lang="ar">${x.ar}</span>
          <span class="fr">${x.fr}</span>
        </div>`;
    }
    const chapterEnd = n % PER_CHAPTER === 0;
    const recap = L.words.map((w) => rtl
      ? `<span class="chip"><b lang="ar">${w.ar}</b> · ${w.latin} · ${w.clue}</span>`
      : `<span class="chip"><b>${w.latin}</b> · ${w.clue}</span>`).join("");
    const left = levelsBeforeGift();
    const giftBlock = newGift >= 0
      ? `<div class="giftcard"><span class="kicker">Cadeau débloqué · photo ${newGift + 1} sur ${GIFT_TOTAL}</span>
           <button id="openGift" aria-label="Voir la photo en grand">${photoHtml(newGift)}</button>
           ${PHOTOS[newGift] && PHOTOS[newGift].caption ? `<span class="caption">${PHOTOS[newGift].caption}</span>` : ""}</div>`
      : unlockedGifts() < GIFT_TOTAL
        ? `<div class="next-gift"><span class="dots">${[0, 1, 2].map((i) => `<i class="${i < GIFT_EVERY - left ? "on" : ""}"></i>`).join("")}</span>Prochaine photo dans ${left} niveau${left > 1 ? "x" : ""}</div>`
        : "";
    const last = n >= RAW[mode].length;
    setTimeout(() => {
      openSheet(`
        <h3>${rtl ? "صحة !" : "Sa7a !"}</h3>
        <p class="sub">${chapterEnd ? `Étape ${chapterOf(n)[0]} terminée` : `Niveau ${n} réussi`}</p>
        <div class="bigstars" aria-label="${stars} étoiles sur 3">${[1, 2, 3].map((i) => `<span class="${i <= stars ? "on" : ""}">★</span>`).join("")}</div>
        <p class="xp">${gained ? `+${gained} XP` : "Tu avais déjà fait mieux sur ce niveau"}</p>
        ${giftBlock}
        ${sayingHtml}
        <div class="recap">${recap}</div>
        <div class="buttons">
          <button class="btn" id="toMap">Carte</button>
          <button class="btn primary" id="toNext">${last ? "Revoir la carte" : `Niveau ${n + 1}`}</button>
        </div>`);
      if (newGift >= 0) $("openGift").onclick = () => openLightbox(newGift);
      $("toMap").onclick = () => { closeSheet(); renderMap(); };
      $("toNext").onclick = () => { closeSheet(); last ? renderMap() : startLevel(n + 1); };
      confetti(newGift >= 0);
    }, 450);
  }

  // ---------- Carnet de dictons ----------
  function renderCarnet() {
    const seen = SAYINGS.map((x, i) => ({ ...x, i, n: store.seenSay[i] || 0 })).filter((x) => x.n);
    $("carnetSub").textContent = `${seen.length} sur ${SAYINGS.length} · ils reviennent tout seuls au fil des niveaux`;
    const list = $("carnetList");
    list.innerHTML = seen.length ? "" : '<p class="empty">Gagne un niveau pour découvrir ton premier dicton.</p>';
    ["proverbe", "rue", "rai"].forEach((k) => {
      const items = seen.filter((x) => x.k === k);
      if (!items.length) return;
      list.insertAdjacentHTML("beforeend", `<h3 class="carnet-h">${KIND_LABEL[k]}</h3>` + items.map((x) => `
        <div class="reward ${k}">
          <span class="dz">${x.dz}</span>
          <span class="dz" dir="rtl" lang="ar">${x.ar}</span>
          <span class="fr">${x.fr}</span>
          <span class="kicker">Vu ${x.n} fois</span>
        </div>`).join(""));
    });
    show("carnet");
  }

  // ---------- Galerie ----------
  function renderGallery() {
    const g = unlockedGifts();
    $("gallerySub").textContent = `${g} photo${g > 1 ? "s" : ""} débloquée${g > 1 ? "s" : ""} sur ${GIFT_TOTAL}`;
    $("galleryGrid").innerHTML = '<div class="thumbs"></div>';
    const grid = $("galleryGrid").firstChild;
    for (let i = 0; i < GIFT_TOTAL; i++) {
      const b = document.createElement("button");
      if (i < g) {
        const p = PHOTOS[i];
        b.className = "thumb";
        b.innerHTML = p ? `<img src="${p.thumb || p.src}" alt="Photo ${i + 1}" loading="lazy">` : `<span class="ph">${i + 1}</span>`;
        b.setAttribute("aria-label", `Voir la photo ${i + 1}`);
        b.onclick = () => openLightbox(i);
      } else {
        b.className = "thumb locked";
        b.disabled = true;
        b.innerHTML = `<span class="num">${i + 1}</span>`;
        b.setAttribute("aria-label", `Photo ${i + 1}, pas encore débloquée`);
      }
      grid.appendChild(b);
    }
    show("gallery");
  }

  let lbIndex = 0;
  function openLightbox(i) {
    lbIndex = i;
    const g = unlockedGifts();
    $("lbImg").innerHTML = photoHtml(i);
    $("lbCount").textContent = `${i + 1} / ${GIFT_TOTAL}`;
    $("lbCap").textContent = (PHOTOS[i] && PHOTOS[i].caption) || "";
    $("lbPrev").disabled = i === 0;
    $("lbNext").disabled = i >= g - 1;
    $("lightbox").hidden = false;
  }
  $("lbClose").onclick = () => { $("lightbox").hidden = true; };
  $("lbPrev").onclick = () => { if (lbIndex > 0) openLightbox(lbIndex - 1); };
  $("lbNext").onclick = () => { if (lbIndex < unlockedGifts() - 1) openLightbox(lbIndex + 1); };
  let touchX = null;
  $("lightbox").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  $("lightbox").addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (dx > 50) $("lbPrev").click(); else if (dx < -50) $("lbNext").click();
  });

  // ---------- Feuille du bas ----------
  function openSheet(html) { $("sheet").innerHTML = html; $("scrim").hidden = false; $("sheet").scrollTop = 0; }
  function closeSheet() { $("scrim").hidden = true; }
  $("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeSheet(); });

  // ---------- Confettis ----------
  function confetti(hearts) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("confetti");
    cv.hidden = false;
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = hearts ? ["#e98aa0", "#f2b33d", "#f6c3cf", "#3d7fd9"] : ["#3d7fd9", "#f2b33d", "#2f9e70", "#dc5a49", "#9cc2f0"];
    const parts = Array.from({ length: 140 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4,
      s: 6 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      col: colors[(Math.random() * colors.length) | 0], heart: hearts && Math.random() < .5,
    }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((p) => {
        p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col;
        if (p.heart) { ctx.font = `${p.s * 2}px sans-serif`; ctx.fillText("♥", -p.s / 2, p.s / 2); }
        else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      });
      if (t - t0 < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })(t0);
  }

  // ---------- Taille de la grille ----------
  function fitBoard() {
    if (!L || $("game").hidden) return;
    const wrap = $("boardwrap");
    const side = Math.min(wrap.clientWidth, wrap.clientHeight - 16, 480);
    const cs = Math.max(22, Math.floor((side - 4 - (L.size - 1) * 2) / L.size));
    $("board").style.setProperty("--cs", `${cs}px`);
  }
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe($("boardwrap"));
  window.addEventListener("resize", fitBoard);

  // ---------- Clavier d'ordinateur et visionneuse ----------
  document.addEventListener("keydown", (e) => {
    if (!$("lightbox").hidden) {
      if (e.key === "Escape") $("lbClose").click();
      if (e.key === "ArrowLeft") $("lbPrev").click();
      if (e.key === "ArrowRight") $("lbNext").click();
      return;
    }
    // Sur ordinateur, taper sans avoir touché de case envoie quand même les lettres dans la grille.
    if ($("game").hidden || !$("scrim").hidden || !sel || keyboardOpen()) return;
    if (e.key.length === 1 || e.key === "Backspace" || e.key.startsWith("Arrow")) openKeyboard();
  });

  // ---------- Branchements ----------
  document.querySelectorAll(".card[data-mode]").forEach((b) => { b.onclick = () => { mode = b.dataset.mode; renderMap(); }; });
  $("openGallery").onclick = renderGallery;
  $("openCarnet").onclick = renderCarnet;
  $("carnetBack").onclick = renderHome;
  $("mapBack").onclick = renderHome;
  $("galleryBack").onclick = renderHome;
  $("gameBack").onclick = () => { kbInput.blur(); renderMap(); };
  $("btnCheck").onclick = check;
  $("btnHint").onclick = hint;
  $("btnClear").onclick = clearGrid;

  applyTheme();
  renderHome();
})();
</script>
